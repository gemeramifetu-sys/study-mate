<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Card -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />
  
  <!-- Graduation Cap -->
  <g transform="translate(256, 175)">
    <!-- Cap Rhombus -->
    <polygon points="0,-75 160,0 0,75 -160,0" fill="url(#capGrad)" stroke="#fef08a" stroke-width="6" filter="url(#glow)" />
    <!-- Inner Diamond -->
    <polygon points="0,-48 105,0 0,48 -105,0" fill="#f59e0b" opacity="0.5" />
    <!-- Skull Cap Base -->
    <path d="M-80,12 C-80,60 80,60 80,12" fill="#b45309" stroke="#fef08a" stroke-width="3" />
    <!-- Tassel -->
    <path d="M-115,5 L-115,115" stroke="#f59e0b" stroke-width="10" stroke-linecap="round" />
    <circle cx="-115" cy="5" r="7" fill="#fbbf24" />
    <rect x="-124" y="115" width="18" height="24" rx="4" fill="#fbbf24" />
  </g>
  
  <!-- Open Book -->
  <g transform="translate(256, 360)">
    <path d="M-150,45 C-75,45 -30,65 0,78 C30,65 75,45 150,45 L150,-45 C75,-45 30,-25 0,-12 C-30,-25 -75,-45 -150,-45 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="12" stroke-linejoin="round" />
    <path d="M0,-12 L0,78" stroke="#38bdf8" stroke-width="8" />
    
    <!-- Ghanaian Black Star Badge -->
    <g transform="translate(0, 32)">
      <polygon points="0,-32 10,-10 32,-10 14,4 20,26 0,12 -20,26 -14,4 -32,-10 -10,-10" fill="#0f172a" stroke="#f59e0b" stroke-width="6" />
    </g>
  </g>
</svg>
